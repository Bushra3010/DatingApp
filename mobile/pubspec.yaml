name: everlane
description: A thoughtful place to meet your person.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  supabase_flutter: ^2.8.0
  flutter:
    sdk: flutter
  record: ^7.1.2
  audioplayers: ^6.8.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
