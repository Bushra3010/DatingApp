<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Everlane — a thoughtful place to meet your person. Mobile UI preview.">

  <!--
    iOS Safari auto-zooms the page when a focused text field's font is under
    16px, and on a Flutter page it then stays zoomed in. Flutter edits text
    through hidden <input>/<textarea> elements whose font it sets inline
    (often 14px), so: force those to 16px (they're transparent, so this
    changes nothing visible) and keep the page from scaling at all.
  -->
  <meta name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <style>
    /*
      Keep the page exactly the width of the screen. If anything makes iOS
      Safari think the page is wider, it zooms out and the app shows up
      narrower than the screen with bars down both sides.

      The viewport deliberately leaves out viewport-fit=cover: Flutter web
      doesn't read iOS safe-area insets, so with it the tab bar ends up under
      the home indicator. Without it, iOS keeps the page inside the safe area.
    */
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      background: #07060B;
    }
    flt-text-editing-host input,
    flt-text-editing-host textarea,
    input.flt-text-editing,
    textarea.flt-text-editing {
      font-size: 16px !important;
    }
  </style>
  <script>
    // Flutter replaces the viewport tag above with its own
    // (maximum-scale=5.0) at start-up; put ours back whenever it does.
    (function () {
      var wanted = 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no';
      function pin() {
        document.querySelectorAll('meta[name="viewport"]').forEach(function (m) {
          if (m.content !== wanted) m.content = wanted;
        });
      }
      new MutationObserver(pin).observe(document.head, {
        childList: true, subtree: true, attributes: true, attributeFilter: ['content']
      });
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Everlane">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Everlane · Meet your kind of person</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=everlane-5" async></script>
</body>
</html>
